name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: trexx/actions/.github/actions/checkout@shared-steps
      - uses: trexx/actions/.github/actions/setup-node@shared-steps
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` runs the postinstall hook that downloads the scrcpy server
      # binary, so this step needs network access (CI has it).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  proxy:
    name: Proxy (fmt + clippy + test + build)
    uses: 'trexx/actions/.github/workflows/rust-check.yml@shared-steps'
    permissions:
      contents: read
    with:
      os: '["ubuntu-latest"]'
      working_directory: proxy
      cargo_args: ''
      build_release: true
